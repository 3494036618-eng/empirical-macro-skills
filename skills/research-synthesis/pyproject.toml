[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "research-synthesis-skill"
version = "0.1.0.dev0"
description = "Evidence-bound research reports for empirical macro research."
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_synthesis"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "research_synthesis/schemas"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=research_synthesis --cov-branch --cov-fail-under=90"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "external: requires pinned upstream artifacts",
]

[tool.coverage.run]
source = ["research_synthesis"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_synthesis"]
